name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Pack dist directory
        run: cd dist && zip -r ../site-dist.zip .

      - name: Create GitHub release with artifact
        uses: softprops/action-gh-release@v2
        with:
          files: site-dist.zip
          generate_release_notes: true
