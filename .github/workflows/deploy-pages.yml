name: Deploy Pages

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag from workflow run SHA
        id: resolve_tag
        run: |
          TAG=$(git tag --points-at "${{ github.event.workflow_run.head_sha }}" | head -n 1)
          if [ -z "$TAG" ]; then
            echo "No tag found for commit ${{ github.event.workflow_run.head_sha }}"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download release asset
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{ steps.resolve_tag.outputs.tag }}
          fileName: site-dist.zip
          out-file-path: .

      - name: Unpack release artifact
        run: mkdir -p dist && unzip -o site-dist.zip -d dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
